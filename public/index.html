<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Journal ECT</title>
<meta name="description" content="Mon journal quotidien de prépa ECT">
<meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f3ec" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Journal ECT">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="masthead">
    <div>
      <div class="kicker" id="dateline">—</div>
      <h1>Journal <em>ECT</em></h1>
    </div>
    <div class="top-actions">
      <select id="archive" aria-label="Éditions précédentes"></select>
      <button id="theme" class="icon-btn" aria-label="Changer de thème">◐</button>
    </div>
  </div>
  <div class="ticker" id="ticker"></div>
</header>

<main id="view" tabindex="-1"></main>

<nav class="tabs" id="tabs">
  <button data-tab="une" class="on"><span>●</span>La Une</button>
  <button data-tab="eco"><span>€</span>Éco</button>
  <button data-tab="droit"><span>§</span>Droit</button>
  <button data-tab="mgmt"><span>◆</span>Mgmt</button>
  <button data-tab="monde"><span>◎</span>Monde</button>
  <button data-tab="quiz"><span>?</span>Quiz</button>
</nav>

<script src="app.js" type="module"></script>
</body>
</html>
